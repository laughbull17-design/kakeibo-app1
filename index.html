<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ふたり家計簿</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#1f2937;
      --sub:#6b7280;
      --line:#e5e7eb;
      --accent:#2563eb;
      --accent2:#10b981;
      --danger:#ef4444;
      --male:#3b82f6;
      --female:#ec4899;
      --common:#8b5cf6;
    }
    body.dark{
      --bg:#0f172a;
      --card:#111827;
      --text:#f3f4f6;
      --sub:#9ca3af;
      --line:#374151;
      --accent:#60a5fa;
      --accent2:#34d399;
      --danger:#f87171;
      --male:#60a5fa;
      --female:#f472b6;
      --common:#a78bfa;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:16px;
    }
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:16px;
      flex-wrap:wrap;
    }
    .title{
      font-size:24px;
      font-weight:700;
    }
    .row{
      display:grid;
      grid-template-columns:repeat(12,1fr);
      gap:16px;
    }
    .card{
      grid-column:span 12;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
      box-shadow:0 4px 14px rgba(0,0,0,.05);
    }
    .card h2{
      margin:0 0 12px;
      font-size:18px;
    }
    .grid-2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    .grid-3{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }
    .grid-4{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
    }
    label{
      display:block;
      font-size:13px;
      color:var(--sub);
      margin-bottom:6px;
    }
    input, select, button, textarea{
      width:100%;
      padding:12px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--card);
      color:var(--text);
      font-size:14px;
    }
    textarea{min-height:80px; resize:vertical}
    button{
      cursor:pointer;
      font-weight:700;
    }
    .btn-primary{
      background:var(--accent);
      color:white;
      border:none;
    }
    .btn-sub{
      background:transparent;
    }
    .btn-danger{
      background:var(--danger);
      color:white;
      border:none;
    }
    .summary{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }
    .metric{
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
    }
    .metric .label{
      color:var(--sub);
      font-size:13px;
      margin-bottom:8px;
    }
    .metric .value{
      font-size:22px;
      font-weight:800;
    }
    .tag{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      color:white;
    }
    .tag-common{background:var(--common)}
    .tag-male{background:var(--male)}
    .tag-female{background:var(--female)}
    .tag-recurring{background:var(--accent2);margin-left:6px}
    .status-active{color:var(--accent2);font-weight:700}
    .status-paused{color:var(--sub);font-weight:700}
    table{
      width:100%;
      border-collapse:collapse;
      font-size:14px;
    }
    th,td{
      padding:10px 8px;
      border-bottom:1px solid var(--line);
      text-align:left;
      vertical-align:top;
    }
    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .small{
      width:auto;
      padding:8px 12px;
      font-size:13px;
    }
    .muted{color:var(--sub)}
    .right{text-align:right}
    .chartbar{
      height:14px;
      background:var(--line);
      border-radius:999px;
      overflow:hidden;
      margin-top:6px;
    }
    .chartfill{
      height:100%;
      border-radius:999px;
    }
    .section-space{margin-top:16px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .tab-btn{width:auto;padding:8px 14px}
    .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .pie-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
    .pie-card{border:1px solid var(--line);border-radius:16px;padding:16px}
    .pie{
      width:min(240px,70vw);
      height:min(240px,70vw);
      border-radius:50%;
      margin:0 auto 14px;
      background:conic-gradient(var(--accent) 0 50%, var(--line) 50% 100%);
      border:1px solid var(--line);
    }
    .pie-title{font-size:17px;font-weight:700;margin-bottom:10px}
    .pie-summary{font-size:14px;margin-bottom:12px}
    .legend{display:grid;gap:8px}
    .legend-item{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
    .legend-label{display:flex;align-items:center;gap:8px;min-width:0}
    .legend-color{width:14px;height:14px;border-radius:4px;flex-shrink:0;border:1px solid rgba(0,0,0,.08)}
    .legend-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .section-title{font-weight:700;font-size:16px;margin-bottom:12px}
    .bar-group{display:grid;gap:14px}
    .bar-box{border:1px solid var(--line);border-radius:14px;padding:14px}
    .budget-result{font-weight:700}
    .budget-result.over{color:var(--danger)}
    .budget-result.under{color:var(--male)}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .cal-cell{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:56px;font-size:13px}
    .cal-head{font-weight:700;text-align:center;background:var(--bg)}
    .cal-mark{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent2);margin-left:4px}
    @media (max-width: 820px){
      .grid-2,.grid-3,.grid-4,.summary{grid-template-columns:1fr}
      .title{font-size:20px}
      table{font-size:13px}
      .hide-mobile{display:none}
      .pie-card{padding:14px}
      .legend-item{font-size:13px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">ふたり家計簿</div>
      <div class="actions">
        <button class="small btn-sub" id="themeBtn">🌙 ダークモード切替</button>
        <button class="small btn-sub" id="exportBtn">CSV書き出し</button>
        <button class="small btn-sub" id="backupBtn">完全バックアップ</button>
        <button class="small btn-danger" id="resetBtn">全データ削除</button>
      </div>
    </div>

    <div class="row">
      <div class="card" style="padding:12px;" data-page="all">
        <div class="tabs">
          <button class="btn-sub tab-btn active" data-tab="ledger" id="ledgerTab">家計簿</button>
          <button class="btn-sub tab-btn" data-tab="analysis" id="analysisTab">分析</button>
        </div>
      </div>
      <div class="card" data-page="ledger">
        <h2>表示月</h2>
        <div class="grid-4">
          <div>
            <label>月を選択</label>
            <input type="month" id="monthPicker" />
          </div>
        </div>
      </div>

      <div class="card" data-page="ledger">
        <h2>月初設定</h2>
        <div class="grid-4">
          <div>
            <label>Kの給料</label>
            <input type="number" id="maleSalary" placeholder="例 300000" />
          </div>
          <div>
            <label>Aの給料</label>
            <input type="number" id="femaleSalary" placeholder="例 250000" />
          </div>
          <div>
            <label>Kの共通振込額</label>
            <input type="number" id="maleTransfer" placeholder="例 80000" />
          </div>
          <div>
            <label>Aの共通振込額</label>
            <input type="number" id="femaleTransfer" placeholder="例 50000" />
          </div>
        </div>
        <div class="section-space">
          <div class="section-title">従来の固定費（月別データとして保持）</div>
          <div id="fixedCostInputs" class="grid-4"></div>
        </div>
        <div id="commonBudgetInputs" class="grid-3 section-space"></div>
        <div class="section-space">
          <button class="btn-primary" id="saveMonthlyBtn">月初設定を保存</button>
        </div>
      </div>

      <div class="card" data-page="ledger">
        <h2>サブスク・固定費管理</h2>
        <div class="muted">一度登録すると、対象月の支出へ重複なしで反映します。マスターの変更は、すでに作成済みの月には影響しません。</div>
        <div class="grid-4 section-space">
          <div>
            <label>項目名</label>
            <input type="text" id="recurringName" placeholder="例 ChatGPT、車ローン" />
          </div>
          <div>
            <label>金額</label>
            <input type="number" id="recurringAmount" placeholder="例 3000" />
          </div>
          <div>
            <label>支出区分</label>
            <select id="recurringOwner">
              <option value="common">共通</option>
              <option value="male">K</option>
              <option value="female">A</option>
            </select>
          </div>
          <div>
            <label>カテゴリ</label>
            <select id="recurringCategory"></select>
          </div>
          <div>
            <label>引き落とし日</label>
            <input type="number" id="recurringDay" min="1" max="31" value="1" />
          </div>
          <div>
            <label>適用開始月</label>
            <input type="month" id="recurringStartMonth" />
          </div>
          <div>
            <label>&nbsp;</label>
            <button class="btn-primary" id="saveRecurringBtn">固定費を登録</button>
          </div>
          <div>
            <label>&nbsp;</label>
            <button class="btn-sub" id="cancelRecurringBtn" style="display:none">編集をキャンセル</button>
          </div>
        </div>
        <div class="actions section-space">
          <button class="small btn-sub" id="applyRecurringBtn">表示月に固定費を反映</button>
          <span class="muted" id="recurringMessage"></span>
        </div>
        <div class="section-space" style="overflow:auto">
          <table>
            <thead>
              <tr>
                <th>状態</th>
                <th>項目</th>
                <th>区分</th>
                <th>カテゴリ</th>
                <th>引落日</th>
                <th>開始月</th>
                <th class="right">金額</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="recurringTable"></tbody>
          </table>
        </div>
      </div>

      <div class="card" data-page="ledger">
        <h2>今月サマリー</h2>
        <div class="summary" id="summaryArea"></div>
      </div>

      <div class="card" data-page="ledger">
        <h2>支出入力</h2>
        <div class="grid-4">
          <div>
            <label>日付</label>
            <input type="date" id="date" />
          </div>
          <div>
            <label>金額</label>
            <input type="number" id="amount" placeholder="例 1200" />
          </div>
          <div>
            <label>支出区分</label>
            <select id="owner">
              <option value="common">共通</option>
              <option value="male">K</option>
              <option value="female">A</option>
            </select>
          </div>
          <div>
            <label>カテゴリ</label>
            <select id="category"></select>
          </div>
        </div>
        <div class="grid-2 section-space">
          <div>
            <label>メモ</label>
            <input type="text" id="memo" placeholder="例 スーパー、ガソリン" />
          </div>
          <div>
            <label>&nbsp;</label>
            <button class="btn-primary" id="saveTxBtn">支出を保存</button>
          </div>
        </div>
        <div class="muted section-space" id="editState"></div>
      </div>

      <div class="card" data-page="ledger">
        <h2>カテゴリ管理</h2>
        <div class="grid-3">
          <div>
            <label>新しいカテゴリ名</label>
            <input type="text" id="newCategory" placeholder="例 医療費" />
          </div>
          <div>
            <label>&nbsp;</label>
            <button class="btn-primary" id="addCategoryBtn">カテゴリ追加</button>
          </div>
          <div></div>
        </div>
        <div class="section-space" id="categoryList"></div>
      </div>

      <div class="card" data-page="analysis">
        <h2>支出グラフ分析</h2>
        <div id="chartArea"></div>
      </div>

      <div class="card" data-page="analysis">
        <h2>共通費用 目標達成分析</h2>
        <div id="budgetAnalysisArea"></div>
      </div>

      <div class="card" data-page="analysis">
        <h2>収支円グラフ（K・A・共通）</h2>
        <div id="pieArea" class="pie-wrap"></div>
      </div>

      <div class="card" data-page="analysis">
        <h2>支出カレンダー</h2>
        <div id="calendarArea"></div>
      </div>

      <div class="card" data-page="ledger">
        <h2>支出一覧</h2>
        <div class="grid-4">
          <div>
            <label>絞り込み</label>
            <select id="filterOwner">
              <option value="">すべて</option>
              <option value="common">共通</option>
              <option value="male">K</option>
              <option value="female">A</option>
            </select>
          </div>
          <div>
            <label>カテゴリ</label>
            <select id="filterCategory">
              <option value="">すべて</option>
            </select>
          </div>
          <div>
            <label>検索</label>
            <input type="text" id="searchText" placeholder="メモ検索" />
          </div>
          <div>
            <label>&nbsp;</label>
            <button class="btn-sub" id="clearFilterBtn">絞り込み解除</button>
          </div>
        </div>
        <div class="section-space" style="overflow:auto">
          <table>
            <thead>
              <tr>
                <th>日付</th>
                <th>区分</th>
                <th>カテゴリ</th>
                <th>メモ</th>
                <th class="right">金額</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="txTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

    function loadState(){
      const fallback = {
        currentMonth: "",
        categories: [...DEFAULT_CATEGORIES],
        monthly: {},
        transactions: [],
        recurringItems: [],
        recurringSkips: {},
        dataVersion: RECURRING_DATA_VERSION,
        theme: "light",
        currentPage: "ledger"
      };
      const candidates = [];
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        let parsed = null;
        try{
          parsed = JSON.parse(raw);
        }catch(e){}
        if(parsed){
          if(Number(parsed.dataVersion || 0) < RECURRING_DATA_VERSION){
            try{
              if(!localStorage.getItem(RECURRING_BACKUP_KEY)){
                localStorage.setItem(RECURRING_BACKUP_KEY, raw);
              }
            }catch(e){}
          }
          candidates.push(parsed);
        }
      }
      candidates.push(...collectLegacyStateCandidates());
      const normalized = candidates.length
        ? normalizeState(mergeStateCandidates([fallback, ...candidates]))
        : normalizeState(fallback);
      const recovered = applyRecoveredSnapshots(normalized);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(recovered));
      return recovered;
    }

    function collectLegacyStateCandidates(){
      const candidates = [];
      for(let i = 0; i < localStorage.length; i++){
        const key = localStorage.key(i);
        if(!key || key === STORAGE_KEY) continue;
        if(key.startsWith(`${STORAGE_KEY}_backup_`)) continue;
        const lowerKey = key.toLowerCase();
        const raw = localStorage.getItem(key);
        if(!raw || !/^\s*[\[{]/.test(raw)) continue;
        try{
          const parsed = JSON.parse(raw);
          if(looksLikeKakeiboState(parsed, lowerKey)){
            candidates.push(parsed);
          }
        }catch(e){}
      }
      return candidates;
    }

    function looksLikeKakeiboState(value, key = ""){
      if(!value || typeof value !== "object") return false;
      if(Array.isArray(value.transactions) || value.monthly || Array.isArray(value.categories)) return true;
      if(key.includes("kakeibo")) return true;
      return Object.keys(value).some(entryKey => {
        return Boolean(normalizeMonthKey(entryKey))
          || ["maleSalary","femaleSalary","maleTransfer","femaleTransfer","commonBudgets","fixedCosts"].includes(entryKey);
      });
    }

    function mergeStateCandidates(candidates){
      return candidates.reduce((merged, candidate) => mergeSingleState(merged, candidate), {
        currentMonth: "",
        categories: [],
        monthly: {},
        transactions: [],
        recurringItems: [],
        recurringSkips: {},
        dataVersion: RECURRING_DATA_VERSION,
        theme: "light",
        currentPage: "ledger"
      });
    }

    function mergeSingleState(base, candidate){
      const merged = base && typeof base === "object" ? {...base} : {};
      const source = candidate && typeof candidate === "object" ? candidate : {};
      const legacyMonthly = extractLegacyMonthlyEntries(source);

      merged.categories = [
        ...(Array.isArray(merged.categories) ? merged.categories : []),
        ...(Array.isArray(source.categories) ? source.categories : [])
      ];
      merged.transactions = [
        ...(Array.isArray(merged.transactions) ? merged.transactions : []),
        ...(Array.isArray(source.transactions) ? source.transactions : [])
      ];
      merged.recurringItems = [
        ...(Array.isArray(merged.recurringItems) ? merged.recurringItems : []),
        ...(Array.isArray(source.recurringItems) ? source.recurringItems : [])
      ];
      merged.recurringSkips = mergeRecurringSkipMaps(merged.recurringSkips, source.recurringSkips);
      merged.monthly = {
        ...(merged.monthly && typeof merged.monthly === "object" ? merged.monthly : {}),
        ...(source.monthly && typeof source.monthly === "object" ? source.monthly : {}),
        ...legacyMonthly
      };
      if(!merged.currentMonth && source.currentMonth) merged.currentMonth = source.currentMonth;
      if(merged.theme !== "dark" && source.theme === "dark") merged.theme = "dark";
      if(merged.currentPage !== "analysis" && source.currentPage === "analysis") merged.currentPage = "analysis";
      merged.dataVersion = Math.max(Number(merged.dataVersion || 0), Number(source.dataVersion || 0), RECURRING_DATA_VERSION);
      return merged;
    }

    function extractLegacyMonthlyEntries(source){
      const monthly = {};
      if(!source || typeof source !== "object") return monthly;
      Object.keys(source).forEach(key => {
        const monthKey = normalizeMonthKey(key);
        if(!monthKey) return;
        monthly[monthKey] = mergeMonthData(monthly[monthKey], source[key]);
      });
      return monthly;
    }

    function normalizeState(rawState){
      const normalized = rawState && typeof rawState === "object" ? rawState : {};
      normalized.categories = Array.isArray(normalized.categories) && normalized.categories.length
        ? [...new Set(normalized.categories.map(cat => String(cat || "").trim()).filter(Boolean))]
        : [...DEFAULT_CATEGORIES];
      normalized.transactions = Array.isArray(normalized.transactions)
        ? dedupeTransactions(normalized.transactions.map(normalizeTransaction).filter(Boolean))
        : [];
      normalized.recurringItems = normalizeRecurringItems(normalized.recurringItems);
      normalized.recurringSkips = normalizeRecurringSkips(normalized.recurringSkips);
      normalized.monthly = normalizeMonthlyMap(normalized.monthly, normalized.transactions);
      normalized.dataVersion = RECURRING_DATA_VERSION;
      normalized.theme = normalized.theme === "dark" ? "dark" : "light";
      normalized.currentPage = normalized.currentPage === "analysis" ? "analysis" : "ledger";
      normalized.currentMonth = normalizeMonthKey(normalized.currentMonth);
      return normalized;
    }

    function normalizeRecurringItems(items){
      const map = new Map();
      (Array.isArray(items) ? items : []).forEach((item, index) => {
        if(!item || typeof item !== "object") return;
        const name = String(item.name || "").trim();
        const amount = Number(item.amount || 0);
        if(!name || amount <= 0) return;
        const id = String(item.id || `legacy-recurring-${index}-${name}`);
        map.set(id, {
          ...item,
          id,
          name,
          amount,
          owner: normalizeOwner(item.owner),
          category: String(item.category || "固定費").trim() || "固定費",
          chargeDay: Math.min(31, Math.max(1, Math.trunc(Number(item.chargeDay || 1)))),
          startMonth: normalizeMonthKey(item.startMonth) || getCurrentMonthKey(),
          active: item.active !== false,
          createdAt: String(item.createdAt || "")
        });
      });
      return [...map.values()];
    }

    function mergeRecurringSkipMaps(left, right){
      const merged = {};
      [left, right].forEach(source => {
        if(!source || typeof source !== "object") return;
        Object.entries(source).forEach(([month, ids]) => {
          const normalizedMonth = normalizeMonthKey(month);
          if(!normalizedMonth || !Array.isArray(ids)) return;
          merged[normalizedMonth] = [...new Set([...(merged[normalizedMonth] || []), ...ids.map(String)])];
        });
      });
      return merged;
    }

    function normalizeRecurringSkips(source){
      return mergeRecurringSkipMaps({}, source);
    }

    function dedupeTransactions(transactions){
      const map = new Map();
      (transactions || []).forEach(tx => {
        if(!tx || !tx.id) return;
        map.set(tx.id, tx);
      });
      return [...map.values()].sort((a, b) => {
        const dateDiff = String(a.date || "").localeCompare(String(b.date || ""));
        if(dateDiff !== 0) return dateDiff;
        return String(a.id).localeCompare(String(b.id));
      });
    }

    function applyRecoveredSnapshots(currentState){
      const base = normalizeState(currentState);
      return RECOVERED_STATE_SNAPSHOTS.reduce((merged, snapshot) => {
        const recovered = normalizeState(snapshot);
        merged.categories = [...new Set([...(merged.categories || []), ...(recovered.categories || [])])];
        merged.transactions = dedupeTransactions([...(merged.transactions || []), ...(recovered.transactions || [])]);

        Object.entries(recovered.monthly || {}).forEach(([month, recoveredMonth]) => {
          const target = getOrCreateRecoveredMonthData(merged, month);
          fillRecoveredNumber(target, "maleSalary", recoveredMonth.maleSalary);
          fillRecoveredNumber(target, "femaleSalary", recoveredMonth.femaleSalary);
          fillRecoveredNumber(target, "maleTransfer", recoveredMonth.maleTransfer);
          fillRecoveredNumber(target, "femaleTransfer", recoveredMonth.femaleTransfer);
          COMMON_BUDGET_CATEGORIES.forEach(cat => fillRecoveredMapValue(target.commonBudgets, cat, recoveredMonth.commonBudgets?.[cat]));
          Object.keys(recoveredMonth.fixedCosts || {}).forEach(cat => fillRecoveredMapValue(target.fixedCosts, cat, recoveredMonth.fixedCosts?.[cat]));
          target.isAutoCreated = isEmptyAutoCreatedMonth(month, target, merged.transactions);
          merged.monthly[month] = normalizeMonthData(month, target, merged.transactions);
        });

        if(!merged.currentMonth && recovered.currentMonth){
          merged.currentMonth = recovered.currentMonth;
        }
        return normalizeState(merged);
      }, base);
    }

    function getOrCreateRecoveredMonthData(targetState, month){
      const existing = targetState.monthly?.[month];
      if(existing && typeof existing === "object"){
        return existing;
      }
      const fresh = normalizeMonthData(month, {
        maleSalary: 0,
        femaleSalary: 0,
        maleTransfer: 0,
        femaleTransfer: 0,
        commonBudgets: {},
        fixedCosts: {},
        isAutoCreated: true
      }, targetState.transactions || []);
      targetState.monthly = targetState.monthly || {};
      targetState.monthly[month] = fresh;
      return fresh;
    }

    function fillRecoveredNumber(target, key, recoveredValue){
      if(Number(target?.[key] || 0) > 0) return;
      if(Number(recoveredValue || 0) <= 0) return;
      target[key] = Number(recoveredValue || 0);
    }

    function fillRecoveredMapValue(targetMap, key, recoveredValue){
      if(!targetMap || !key) return;
      if(Number(targetMap[key] || 0) > 0) return;
      if(Number(recoveredValue || 0) <= 0) return;
      targetMap[key] = Number(recoveredValue || 0);
    }

    function normalizeMonthlyMap(monthlyMap, transactions){
      const source = monthlyMap && typeof monthlyMap === "object" ? monthlyMap : {};
      const normalized = {};
      const months = new Set();
      Object.keys(source).forEach(month => {
        const normalizedMonth = normalizeMonthKey(month);
        if(normalizedMonth){
          months.add(normalizedMonth);
          normalized[normalizedMonth] = mergeMonthData(normalized[normalizedMonth], source[month]);
        }
      });
      (transactions || []).forEach(tx => {
        if(tx?.month) months.add(tx.month);
      });
      months.forEach(month => {
        normalized[month] = normalizeMonthData(month, normalized[month], transactions);
      });
      return normalized;
    }

    function mergeMonthData(base, extra){
      const left = base && typeof base === "object" ? base : {};
      const right = extra && typeof extra === "object" ? extra : {};
      return {
        ...left,
        ...right,
        fixedCosts: {
          ...(left.fixedCosts && typeof left.fixedCosts === "object" ? left.fixedCosts : {}),
          ...(right.fixedCosts && typeof right.fixedCosts === "object" ? right.fixedCosts : {})
        },
        commonBudgets: {
          ...(left.commonBudgets && typeof left.commonBudgets === "object" ? left.commonBudgets : {}),
          ...(right.commonBudgets && typeof right.commonBudgets === "object" ? right.commonBudgets : {})
        }
      };
    }

    function normalizeMonthKey(value){
      const text = String(value || "").trim();
      const match = text.match(/^(\d{4})[-/年](\d{1,2})(?:[-/月](\d{1,2})日?)?月?$/);
      if(!match) return "";
      const year = Number(match[1]);
      const month = Number(match[2]);
      if(!year || month < 1 || month > 12) return "";
      return `${year}-${String(month).padStart(2, "0")}`;
    }

    function normalizeMonthData(month, rawMonthData, transactions){
      const monthData = rawMonthData && typeof rawMonthData === "object" ? rawMonthData : {};
      monthData.maleSalary = Number(monthData.maleSalary || 0);
      monthData.femaleSalary = Number(monthData.femaleSalary || 0);
      monthData.maleTransfer = Number(monthData.maleTransfer || 0);
      monthData.femaleTransfer = Number(monthData.femaleTransfer || 0);
      monthData.fixedCosts = normalizeNumberMap(monthData.fixedCosts, FIXED_COST_CATEGORIES);
      monthData.commonBudgets = normalizeNumberMap(monthData.commonBudgets, COMMON_BUDGET_CATEGORIES);
      if(monthData.isAutoCreated == null){
        monthData.isAutoCreated = isEmptyAutoCreatedMonth(month, monthData, transactions);
      }else{
        monthData.isAutoCreated = Boolean(monthData.isAutoCreated);
      }
      return monthData;
    }

    function normalizeNumberMap(source, keys){
      const normalized = source && typeof source === "object" ? {...source} : {};
      keys.forEach(key => {
        normalized[key] = Number(normalized[key] || 0);
      });
      return normalized;
    }

    function normalizeTransaction(tx, index){
      if(!tx || typeof tx !== "object") return null;
      const date = typeof tx.date === "string" && tx.date ? tx.date : "";
      const month = normalizeMonthKey(tx.month) || normalizeMonthKey(date.slice(0,7));
      const owner = normalizeOwner(tx.owner);
      const category = typeof tx.category === "string" && tx.category.trim()
        ? tx.category.trim()
        : "未分類";
      return {
        ...tx,
        id: tx.id || `legacy-${month || "month"}-${date || "date"}-${index || 0}`,
        date,
        month,
        amount: Number(tx.amount || 0),
        owner,
        category,
        memo: typeof tx.memo === "string" ? tx.memo : "",
        recurringId: tx.recurringId ? String(tx.recurringId) : "",
        isRecurring: Boolean(tx.isRecurring || tx.recurringId)
      };
    }

    function isEmptyAutoCreatedMonth(month, monthData, transactions){
      const hasTransactions = transactions.some(t => t.month === month);
      const hasMonthlyValues = Number(monthData.maleSalary || 0) > 0
        || Number(monthData.femaleSalary || 0) > 0
        || Number(monthData.maleTransfer || 0) > 0
        || Number(monthData.femaleTransfer || 0) > 0;
      const hasFixedCosts = FIXED_COST_CATEGORIES.some(cat => Number(monthData.fixedCosts?.[cat] || 0) > 0);
      const hasCommonBudgets = Object.values(monthData.commonBudgets || {}).some(v => Number(v || 0) > 0);
      return !hasTransactions && !hasMonthlyValues && !hasFixedCosts && !hasCommonBudgets;
    }

    function saveState(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getMonthData(month){
      if(!state.monthly[month]){
        state.monthly[month] = normalizeMonthData(month, {
          maleSalary: 0,
          femaleSalary: 0,
          maleTransfer: 0,
          femaleTransfer: 0,
          commonBudgets: {},
          fixedCosts: getInheritedFixedCosts(month),
          isAutoCreated: true
        }, state.transactions);
      }
      if(state.monthly[month].isAutoCreated){
        state.monthly[month].fixedCosts = getInheritedFixedCosts(month);
      }
      state.monthly[month] = normalizeMonthData(month, state.monthly[month], state.transactions);
      return state.monthly[month];
    }

    function getInheritedFixedCosts(month){
      let previousMonth = getPreviousMonthKey(month);
      const visited = new Set();
      while(previousMonth && !visited.has(previousMonth)){
        visited.add(previousMonth);
        const previous = state.monthly[previousMonth];
        if(previous && !previous.isAutoCreated){
          return normalizeNumberMap(previous.fixedCosts, FIXED_COST_CATEGORIES);
        }
        previousMonth = getPreviousMonthKey(previousMonth);
      }
      return normalizeNumberMap({}, FIXED_COST_CATEGORIES);
    }

    function renderBudgetInputs(){
      els.commonBudgetInputs.innerHTML = COMMON_BUDGET_CATEGORIES.map(cat => `
        <div>
          <label>${escapeHtml(cat)}の月予算（共通費）</label>
          <input type="number" data-budget-cat="${escapeHtml(cat)}" placeholder="例 20000" />
        </div>
      `).join("");
    }

    function renderFixedCostInputs(){
      els.fixedCostInputs.innerHTML = FIXED_COST_CATEGORIES.map(cat => `
        <div>
          <label>${escapeHtml(cat)}（固定費・次月引き継ぎ）</label>
          <input type="number" data-fixed-cost-cat="${escapeHtml(cat)}" placeholder="例 12000" />
        </div>
      `).join("");
    }

    function loadMonthlyInputs(){
      const m = getMonthData(state.currentMonth);
      els.maleSalary.value = m.maleSalary || "";
      els.femaleSalary.value = m.femaleSalary || "";
      els.maleTransfer.value = m.maleTransfer || "";
      els.femaleTransfer.value = m.femaleTransfer || "";
      COMMON_BUDGET_CATEGORIES.forEach(cat => {
        const input = document.querySelector(`[data-budget-cat="${cat}"]`);
        if(input) input.value = m.commonBudgets?.[cat] || "";
      });
      FIXED_COST_CATEGORIES.forEach(cat => {
        const input = document.querySelector(`[data-fixed-cost-cat="${cat}"]`);
        if(input) input.value = m.fixedCosts?.[cat] || "";
      });
    }

    function saveMonthlyData(){
      const m = getMonthData(state.currentMonth);
      m.maleSalary = Number(els.maleSalary.value || 0);
      m.femaleSalary = Number(els.femaleSalary.value || 0);
      m.maleTransfer = Number(els.maleTransfer.value || 0);
      m.femaleTransfer = Number(els.femaleTransfer.value || 0);
      m.commonBudgets = m.commonBudgets || {};
      COMMON_BUDGET_CATEGORIES.forEach(cat => {
        const input = document.querySelector(`[data-budget-cat="${cat}"]`);
        m.commonBudgets[cat] = Number(input?.value || 0);
      });
      m.fixedCosts = m.fixedCosts || {};
      FIXED_COST_CATEGORIES.forEach(cat => {
        const input = document.querySelector(`[data-fixed-cost-cat="${cat}"]`);
        m.fixedCosts[cat] = Number(input?.value || 0);
      });
      m.isAutoCreated = false;
      state.monthly[state.currentMonth] = normalizeMonthData(state.currentMonth, m, state.transactions);
      saveState();
      loadMonthlyInputs();
      renderAll();
      alert("月初設定を保存しました");
    }

    function getPreviousMonthKey(month){
      const [year, monthNum] = String(month || "").split("-").map(Number);
      if(!year || !monthNum) return "";
      const dt = new Date(year, monthNum - 2, 1);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2,"0")}`;
    }

    function getCurrentMonthKey(){
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2,"0")}`;
    }

    function getTodayDateKey(){
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
    }

    function renderRecurringCategoryOptions(){
      const current = els.recurringCategory.value;
      els.recurringCategory.innerHTML = "";
      state.categories.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        els.recurringCategory.appendChild(opt);
      });
      const preferred = current && state.categories.includes(current)
        ? current
        : (state.categories.includes("固定費") ? "固定費" : (state.categories[0] || ""));
      els.recurringCategory.value = preferred;
    }

    function resetRecurringForm(){
      editingRecurringId = null;
      els.recurringName.value = "";
      els.recurringAmount.value = "";
      els.recurringOwner.value = "common";
      els.recurringDay.value = "1";
      els.recurringStartMonth.value = state.currentMonth || getCurrentMonthKey();
      renderRecurringCategoryOptions();
      els.saveRecurringBtn.textContent = "固定費を登録";
      els.cancelRecurringBtn.style.display = "none";
    }

    function saveRecurringItem(){
      const name = String(els.recurringName.value || "").trim();
      const amount = Number(els.recurringAmount.value || 0);
      const owner = normalizeOwner(els.recurringOwner.value);
      const category = String(els.recurringCategory.value || "").trim();
      const chargeDay = Math.min(31, Math.max(1, Math.trunc(Number(els.recurringDay.value || 1))));
      const startMonth = normalizeMonthKey(els.recurringStartMonth.value);

      if(!name) return alert("項目名を入力してください");
      if(!amount || amount <= 0) return alert("金額を正しく入力してください");
      if(!category) return alert("カテゴリを選んでください");
      if(!startMonth) return alert("適用開始月を選んでください");

      const isNew = !editingRecurringId;
      let item;
      if(isNew){
        item = {
          id: crypto.randomUUID(),
          name,
          amount,
          owner,
          category,
          chargeDay,
          startMonth,
          active: true,
          createdAt: new Date().toISOString()
        };
        state.recurringItems.push(item);
      }else{
        const index = state.recurringItems.findIndex(entry => entry.id === editingRecurringId);
        if(index < 0) return resetRecurringForm();
        item = {
          ...state.recurringItems[index],
          name,
          amount,
          owner,
          category,
          chargeDay,
          startMonth
        };
        state.recurringItems[index] = item;
      }

      let added = 0;
      if(isNew && startMonth <= state.currentMonth){
        added = createRecurringTransaction(item, state.currentMonth) ? 1 : 0;
      }
      saveState();
      resetRecurringForm();
      renderAll();
      setRecurringMessage(isNew
        ? `固定費を登録しました${added ? "。表示月にも反映済みです" : ""}`
        : "固定費を更新しました。作成済みの月は変更していません");
    }

    function renderRecurringItems(){
      const items = [...(state.recurringItems || [])].sort((a, b) => {
        if(a.active !== b.active) return a.active ? -1 : 1;
        return String(a.name).localeCompare(String(b.name), "ja");
      });
      els.recurringTable.innerHTML = items.map(item => `
        <tr>
          <td><span class="${item.active ? "status-active" : "status-paused"}">${item.active ? "有効" : "停止中"}</span></td>
          <td>${escapeHtml(item.name)}</td>
          <td>${ownerTag(item.owner)}</td>
          <td>${escapeHtml(item.category)}</td>
          <td>${item.chargeDay}日</td>
          <td>${escapeHtml(item.startMonth)}</td>
          <td class="right">${yen(item.amount)}</td>
          <td>
            <div class="actions">
              <button class="small btn-sub" onclick="editRecurring('${escapeJs(item.id)}')">編集</button>
              <button class="small ${item.active ? "btn-danger" : "btn-sub"}" onclick="toggleRecurring('${escapeJs(item.id)}')">${item.active ? "停止" : "再開"}</button>
            </div>
          </td>
        </tr>
      `).join("") || `<tr><td colspan="8" class="muted">登録されたサブスク・固定費はありません</td></tr>`;
    }

    window.editRecurring = function(id){
      const item = state.recurringItems.find(entry => entry.id === id);
      if(!item) return;
      editingRecurringId = id;
      els.recurringName.value = item.name;
      els.recurringAmount.value = item.amount;
      els.recurringOwner.value = item.owner;
      renderRecurringCategoryOptions();
      els.recurringCategory.value = item.category;
      els.recurringDay.value = item.chargeDay;
      els.recurringStartMonth.value = item.startMonth;
      els.saveRecurringBtn.textContent = "固定費の編集を保存";
      els.cancelRecurringBtn.style.display = "";
      setRecurringMessage("固定費を編集中です");
    }

    window.toggleRecurring = function(id){
      const item = state.recurringItems.find(entry => entry.id === id);
      if(!item) return;
      if(item.active && !confirm(`「${item.name}」を停止しますか？ 過去の支出は残ります。`)) return;
      item.active = !item.active;
      if(item.active){
        ensureRecurringTransactions(getCurrentMonthKey(), false);
      }
      saveState();
      renderAll();
      setRecurringMessage(item.active ? `${item.name}を再開しました` : `${item.name}を停止しました`);
    }

    function applyRecurringForCurrentCalendarMonth(){
      const added = ensureRecurringTransactions(getCurrentMonthKey(), false);
      if(added) setRecurringMessage(`${added}件の固定費を今月へ自動反映しました`);
    }

    function ensureRecurringTransactions(month, force = false){
      const normalizedMonth = normalizeMonthKey(month);
      if(!normalizedMonth) return 0;
      if(!force && normalizedMonth !== getCurrentMonthKey()) return 0;
      let added = 0;
      (state.recurringItems || []).forEach(item => {
        if(createRecurringTransaction(item, normalizedMonth)) added++;
      });
      if(added) saveState();
      return added;
    }

    function createRecurringTransaction(item, month){
      if(!item?.active || item.startMonth > month) return false;
      const skipped = state.recurringSkips?.[month] || [];
      if(skipped.includes(item.id)) return false;
      const exists = state.transactions.some(tx => tx.month === month && tx.recurringId === item.id);
      if(exists) return false;
      state.transactions.push({
        id: crypto.randomUUID(),
        date: getRecurringDate(month, item.chargeDay),
        month,
        amount: Number(item.amount || 0),
        owner: normalizeOwner(item.owner),
        category: item.category,
        memo: item.name,
        recurringId: item.id,
        isRecurring: true,
        generatedAt: new Date().toISOString()
      });
      return true;
    }

    function getRecurringDate(month, chargeDay){
      const [year, monthNumber] = month.split("-").map(Number);
      const lastDay = new Date(year, monthNumber, 0).getDate();
      const day = Math.min(lastDay, Math.max(1, Math.trunc(Number(chargeDay || 1))));
      return `${month}-${String(day).padStart(2,"0")}`;
    }

    function setRecurringMessage(message){
      els.recurringMessage.textContent = message || "";
    }

    function renderCategoryOptions(){
      els.category.innerHTML = "";
      state.categories.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        els.category.appendChild(opt);
      });

      els.categoryList.innerHTML = state.categories.map(cat => `
        <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);padding:10px 12px;border-radius:12px;margin-bottom:8px;">
          <div>${escapeHtml(cat)}</div>
          <div class="actions">
            <button class="small btn-sub" onclick="renameCategory('${escapeJs(cat)}')">名前変更</button>
            <button class="small btn-danger" onclick="deleteCategory('${escapeJs(cat)}')">削除</button>
          </div>
        </div>
      `).join("");
    }

    function renderFilterCategoryOptions(){
      const current = els.filterCategory.value;
      els.filterCategory.innerHTML = '<option value="">すべて</option>';
      state.categories.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        els.filterCategory.appendChild(opt);
      });
      if([...els.filterCategory.options].some(o => o.value === current)){
        els.filterCategory.value = current;
      }
    }

    function addCategory(){
      const name = (els.newCategory.value || "").trim();
      if(!name) return alert("カテゴリ名を入力してください");
      if(state.categories.includes(name)) return alert("同じカテゴリがあります");
      state.categories.push(name);
      saveState();
      els.newCategory.value = "";
      renderCategoryOptions();
      renderFilterCategoryOptions();
      renderRecurringCategoryOptions();
    }

    window.renameCategory = function(oldName){
      const next = prompt("新しいカテゴリ名を入力してください", oldName);
      if(!next) return;
      const name = next.trim();
      if(!name) return;
      if(name !== oldName && state.categories.includes(name)) return alert("同じカテゴリがあります");

      state.categories = state.categories.map(c => c === oldName ? name : c);
      state.transactions.forEach(t => {
        if(t.category === oldName) t.category = name;
      });
      state.recurringItems.forEach(item => {
        if(item.category === oldName) item.category = name;
      });
      saveState();
      renderCategoryOptions();
      renderFilterCategoryOptions();
      renderRecurringCategoryOptions();
      renderAll();
    }

    window.deleteCategory = function(name){
      const used = state.transactions.some(t => t.category === name)
        || state.recurringItems.some(item => item.category === name);
      if(used){
        alert("このカテゴリは支出または固定費で使用中なので削除できません");
        return;
      }
      if(!confirm("カテゴリを削除しますか？")) return;
      state.categories = state.categories.filter(c => c !== name);
      saveState();
      renderCategoryOptions();
      renderFilterCategoryOptions();
      renderRecurringCategoryOptions();
    }

    function saveTransaction(){
      const date = els.date.value;
      const amount = Number(els.amount.value || 0);
      const owner = els.owner.value;
      const category = els.category.value;
      const memo = (els.memo.value || "").trim();

      if(!date) return alert("日付を入力してください");
      if(!amount || amount <= 0) return alert("金額を正しく入力してください");
      if(!category) return alert("カテゴリを選んでください");

      const existingTx = editingId ? state.transactions.find(t => t.id === editingId) : null;
      const tx = {
        ...(existingTx || {}),
        id: editingId || crypto.randomUUID(),
        date,
        month: date.slice(0,7),
        amount,
        owner,
        category,
        memo
      };

      if(existingTx?.recurringId && existingTx.month && existingTx.month !== tx.month){
        state.recurringSkips[existingTx.month] = [
          ...new Set([...(state.recurringSkips[existingTx.month] || []), existingTx.recurringId])
        ];
      }

      if(editingId){
        const idx = state.transactions.findIndex(t => t.id === editingId);
        state.transactions[idx] = tx;
        editingId = null;
        els.saveTxBtn.textContent = "支出を保存";
        els.editState.textContent = "";
      }else{
        state.transactions.push(tx);
      }

      saveState();
      clearForm();
      renderAll();
    }

    function clearForm(){
      els.amount.value = "";
      els.memo.value = "";
      els.owner.value = "common";
      els.category.value = state.categories[0] || "";
      els.date.value = getTodayDateKey();
    }

    function getTransactionsForCurrentMonth(){
      return state.transactions
        .filter(t => t.month === state.currentMonth)
        .map(t => ({...t, owner: normalizeOwner(t.owner)}))
        .sort((a,b) => b.date.localeCompare(a.date));
    }

    function renderAll(){
      renderSummary();
      renderTransactions();
      renderCharts();
      renderBudgetAnalysis();
      renderPieCharts();
      renderCalendar();
      renderRecurringItems();
    }

    function setPage(page){
      state.currentPage = page;
      saveState();
      els.pageCards.forEach(card => {
        const scope = card.dataset.page;
        card.style.display = (scope === "all" || scope === page) ? "" : "none";
      });
      els.tabButtons.forEach(btn => btn.classList.toggle("active", btn.dataset.tab === page));
    }

    function renderSummary(){
      const finance = getMonthlyFinance();
      const commonShareMetrics = [
        {
          label: "Kの按分後残額（共通費60%反映）",
          value: finance.ownerBalances.male
        },
        {
          label: "Aの按分後残額（共通費40%反映）",
          value: finance.ownerBalances.female
        }
      ];

      els.summaryArea.innerHTML = `
        <div class="metric">
          <div class="label">2人の振込額 - 共通支出</div>
          <div class="value">${yen(finance.commonRemain)}</div>
        </div>
        <div class="metric">
          <div class="label">Kの給料 - Kの支出合計</div>
          <div class="value">${yen(finance.ownerRemain.male)}</div>
        </div>
        <div class="metric">
          <div class="label">Aの給料 - Aの支出合計</div>
          <div class="value">${yen(finance.ownerRemain.female)}</div>
        </div>
        <div class="metric">
          <div class="label">共通支出合計</div>
          <div class="value">${yen(finance.commonExpense)}</div>
        </div>
        ${commonShareMetrics.map(metric => `
          <div class="metric">
            <div class="label">${metric.label}</div>
            <div class="value">${yen(metric.value)}</div>
          </div>
        `).join("")}
      `;
    }

    function renderTransactions(){
      const list = getTransactionsForCurrentMonth()
        .filter(t => !els.filterOwner.value || t.owner === els.filterOwner.value)
        .filter(t => !els.filterCategory.value || t.category === els.filterCategory.value)
        .filter(t => !els.searchText.value || (t.memo || "").toLowerCase().includes(els.searchText.value.toLowerCase()));

      els.txTable.innerHTML = list.map(t => `
        <tr>
          <td>${escapeHtml(t.date)}</td>
          <td>${ownerTag(t.owner)}</td>
          <td>${escapeHtml(t.category)}${t.isRecurring ? '<span class="tag tag-recurring">自動</span>' : ''}</td>
          <td>${escapeHtml(t.memo || "")}</td>
          <td class="right">${yen(t.amount)}</td>
          <td>
            <div class="actions">
              <button class="small btn-sub" onclick="editTx('${t.id}')">編集</button>
              <button class="small btn-danger" onclick="deleteTx('${t.id}')">削除</button>
            </div>
          </td>
        </tr>
      `).join("") || `<tr><td colspan="6" class="muted">まだ支出がありません</td></tr>`;
    }

    window.editTx = function(id){
      const t = state.transactions.find(x => x.id === id);
      if(!t) return;
      editingId = id;
      els.date.value = t.date;
      els.amount.value = t.amount;
      els.owner.value = t.owner;
      els.category.value = t.category;
      els.memo.value = t.memo || "";
      els.saveTxBtn.textContent = "編集を保存";
      els.editState.textContent = "編集中です。内容を直して「編集を保存」を押してください。";
      window.scrollTo({top: 0, behavior: "smooth"});
    }

    window.deleteTx = function(id){
      const target = state.transactions.find(t => t.id === id);
      if(!target) return;
      const message = target.recurringId
        ? "この月の固定費を削除しますか？ この月には自動で再追加されません。"
        : "この支出を削除しますか？";
      if(!confirm(message)) return;
      if(target.recurringId && target.month){
        state.recurringSkips[target.month] = [
          ...new Set([...(state.recurringSkips[target.month] || []), target.recurringId])
        ];
      }
      state.transactions = state.transactions.filter(t => t.id !== id);
      if(editingId === id){
        editingId = null;
        els.saveTxBtn.textContent = "支出を保存";
        els.editState.textContent = "";
        clearForm();
      }
      saveState();
      renderAll();
    }

    function renderCharts(){
      const finance = getMonthlyFinance();
      const total = finance.commonExpense + finance.ownerExpenses.male + finance.ownerExpenses.female || 1;
      const catRows = Object.entries(finance.categoryTotals).sort((a,b) => b[1]-a[1]);

      els.chartArea.innerHTML = `
        <div class="grid-2">
          <div class="bar-box">
            <div class="section-title">支出区分の比率</div>
            <div class="bar-group">
              ${barRow("共通", finance.commonExpense, total, "var(--common)")}
              ${barRow("K", finance.ownerExpenses.male, total, "var(--male)")}
              ${barRow("A", finance.ownerExpenses.female, total, "var(--female)")}
            </div>
          </div>
          <div class="bar-box">
            <div class="section-title">カテゴリ別支出</div>
            <div class="bar-group">
              ${catRows.length ? catRows.map(([name,val]) => barRow(name, val, sum(catRows.map(x=>x[1])) || 1, getCategoryColor(name))).join("") : '<div class="muted">まだデータがありません</div>'}
            </div>
          </div>
        </div>
      `;
    }

    function renderBudgetAnalysis(){
      const list = getTransactionsForCurrentMonth().filter(t => t.owner === "common");
      const budgets = getMonthData(state.currentMonth).commonBudgets || {};
      els.budgetAnalysisArea.innerHTML = COMMON_BUDGET_CATEGORIES.map(cat => {
        const spent = sum(list.filter(t => t.category.includes(cat)).map(t => t.amount));
        const budget = Number(budgets[cat] || 0);
        const diff = budget - spent;
        const total = Math.max(budget, spent, 1);
        const color = diff >= 0 ? "var(--male)" : "var(--danger)";
        const text = diff >= 0 ? `残額 ${yen(diff)}` : `${yen(diff)}`;
        return `
          <div style="margin-bottom:14px;border:1px solid var(--line);border-radius:14px;padding:14px;">
            <div style="display:flex;justify-content:space-between;gap:8px;">
              <div>${escapeHtml(cat)}（予算 ${yen(budget)} / 使用 ${yen(spent)}）</div>
              <div class="budget-result ${diff >= 0 ? "under" : "over"}">${text}</div>
            </div>
            <div class="chartbar" style="height:18px;margin-top:10px;"><div class="chartfill" style="width:${Math.round((spent/total)*100)}%;background:${color}"></div></div>
          </div>
        `;
      }).join("");
    }

    function renderPieCharts(){
      const finance = getMonthlyFinance();
      const charts = [
        buildOwnerPieData("male", finance),
        buildOwnerPieData("female", finance),
        buildCommonPieData(finance)
      ];

      els.pieArea.innerHTML = charts.map(chart => {
        const gradient = buildPieGradient(chart.segments);
        return `<div class="pie-card">
          <div class="pie-title">${chart.title}</div>
          <div class="pie" style="background:${gradient};"></div>
          <div class="pie-summary muted">${chart.summary}</div>
          <div class="legend">
            ${chart.segments.map(segment => `
              <div class="legend-item">
                <div class="legend-label">
                  <span class="legend-color" style="background:${segment.color};"></span>
                  <span class="legend-text">${escapeHtml(segment.label)}</span>
                </div>
                <div>${yen(segment.displayValue)} / ${segment.percent}%</div>
              </div>
            `).join("")}
          </div>
        </div>`;
      }).join("");
    }

    function renderCalendar(){
      const month = state.currentMonth;
      if(!month) return;
      const [y,m] = month.split("-").map(Number);
      const firstDay = new Date(y, m - 1, 1);
      const lastDate = new Date(y, m, 0).getDate();
      const marks = new Set(getTransactionsForCurrentMonth().map(t => Number(t.date.slice(8,10))));
      const heads = ["日","月","火","水","木","金","土"].map(d => `<div class="cal-cell cal-head">${d}</div>`).join("");
      const blanks = Array(firstDay.getDay()).fill('<div class="cal-cell"></div>').join("");
      const days = Array.from({length:lastDate}, (_,i) => i + 1).map(day => `<div class="cal-cell">${day}${marks.has(day) ? '<span class="cal-mark"></span>' : ''}</div>`).join("");
      els.calendarArea.innerHTML = `<div class="calendar">${heads}${blanks}${days}</div><div class="muted section-space">● がついている日が支出あり</div>`;
    }

    function barRow(label, value, total, color){
      const pct = Math.round((value / total) * 100);
      return `
        <div>
          <div style="display:flex;justify-content:space-between;gap:8px;">
            <div>${escapeHtml(label)}</div>
            <div>${yen(value)} / ${pct}%</div>
          </div>
          <div class="chartbar" style="height:18px;margin-top:8px;">
            <div class="chartfill" style="width:${pct}%;background:${color};"></div>
          </div>
        </div>
      `;
    }

    function getMonthlyFinance(){
      const list = getTransactionsForCurrentMonth();
      const monthData = getMonthData(state.currentMonth);
      const commonExpense = sum(list.filter(t => t.owner === "common").map(t => t.amount));
      const ownerExpenses = {
        male: sum(list.filter(t => t.owner === "male").map(t => t.amount)),
        female: sum(list.filter(t => t.owner === "female").map(t => t.amount))
      };
      const ownerIncomes = {
        male: Number(monthData.maleSalary || 0),
        female: Number(monthData.femaleSalary || 0)
      };
      const ownerCommonShare = {
        male: commonExpense * OWNER_META.male.share,
        female: commonExpense * OWNER_META.female.share
      };
      const ownerBalances = {
        male: ownerIncomes.male - (ownerExpenses.male + ownerCommonShare.male),
        female: ownerIncomes.female - (ownerExpenses.female + ownerCommonShare.female)
      };
      const ownerRemain = {
        male: ownerIncomes.male - ownerExpenses.male,
        female: ownerIncomes.female - ownerExpenses.female
      };
      const commonIncome = Number(monthData.maleTransfer || 0) + Number(monthData.femaleTransfer || 0);
      const categoryTotals = {};
      list.forEach(t => {
        const key = t.category || "未分類";
        categoryTotals[key] = (categoryTotals[key] || 0) + Number(t.amount || 0);
      });
      return {
        list,
        monthData,
        commonExpense,
        commonIncome,
        commonRemain: commonIncome - commonExpense,
        ownerExpenses,
        ownerIncomes,
        ownerRemain,
        ownerCommonShare,
        ownerBalances,
        categoryTotals
      };
    }

    function buildOwnerPieData(owner, finance){
      const ownerLabel = OWNER_META[owner].label;
      const income = finance.ownerIncomes[owner];
      const personalTx = finance.list.filter(t => t.owner === owner);
      const categoryMap = {};
      personalTx.forEach(t => {
        const key = t.category || "未分類";
        categoryMap[key] = (categoryMap[key] || 0) + Number(t.amount || 0);
      });
      categoryMap["共通負担"] = finance.ownerCommonShare[owner];
      const spent = sum(Object.values(categoryMap));
      if(income > spent){
        categoryMap["残額"] = income - spent;
      }else if(spent > income){
        categoryMap["超過"] = spent - income;
      }
      return {
        title: `${ownerLabel}の収支円グラフ`,
        summary: `収入 ${yen(income)} / 支出+共通負担 ${yen(spent)}`,
        segments: createPieSegments(categoryMap, income, spent, owner)
      };
    }

    function buildCommonPieData(finance){
      const categoryMap = {};
      finance.list.filter(t => t.owner === "common").forEach(t => {
        const key = t.category || "未分類";
        categoryMap[key] = (categoryMap[key] || 0) + Number(t.amount || 0);
      });
      if(finance.commonIncome > finance.commonExpense){
        categoryMap["残額"] = finance.commonIncome - finance.commonExpense;
      }else if(finance.commonExpense > finance.commonIncome){
        categoryMap["超過"] = finance.commonExpense - finance.commonIncome;
      }
      return {
        title: "共通費の円グラフ",
        summary: `共通資金 ${yen(finance.commonIncome)} / 共通支出 ${yen(finance.commonExpense)}`,
        segments: createPieSegments(categoryMap, finance.commonIncome, finance.commonExpense, "common")
      };
    }

    function createPieSegments(categoryMap, baseValue, spentValue, paletteKey){
      const safeMap = Object.entries(categoryMap).filter(([, value]) => Number(value || 0) > 0);
      if(!safeMap.length){
        return [{
          label: "データなし",
          value: 1,
          displayValue: 0,
          color: "var(--line)",
          percent: 0
        }];
      }
      const total = Math.max(sum(safeMap.map(([, value]) => value)), baseValue || 0, spentValue || 0, 1);
      const specialLabels = new Set(["残額", "超過", "共通負担"]);
      const sorted = [...safeMap].sort((a, b) => b[1] - a[1]);
      const primary = [];
      const secondary = [];

      sorted.forEach(([label, value]) => {
        const percent = (value / total) * 100;
        const shouldKeep = specialLabels.has(label) || primary.length < 5 || percent >= 8;
        if(shouldKeep){
          primary.push([label, value]);
        }else{
          secondary.push([label, value]);
        }
      });

      if(secondary.length){
        primary.push([
          "そのほか",
          sum(secondary.map(([, value]) => value))
        ]);
      }

      const palette = PIE_PALETTES[paletteKey] || FIXED_CHART_COLORS;
      let paletteIndex = 0;
      return primary.map(([label, value]) => ({
        label,
        value,
        displayValue: value,
        color: getPieSegmentColor(label, palette, paletteIndex++),
        percent: Math.round((value / total) * 100)
      }));
    }

    function buildPieGradient(segments){
      if(!segments.length){
        return "conic-gradient(var(--line) 0 100%)";
      }
      let current = 0;
      const total = sum(segments.map(segment => segment.value)) || 1;
      const stops = segments.map(segment => {
        const start = current;
        current += (segment.value / total) * 100;
        return `${segment.color} ${start}% ${current}%`;
      });
      return `conic-gradient(${stops.join(",")})`;
    }

    function getCategoryColor(label){
      if(label === "残額") return "#2563eb";
      if(label === "超過") return "#ef4444";
      if(label === "共通負担") return "#8b5cf6";
      if(label === "そのほか") return "#94a3b8";
      if(CATEGORY_COLOR_MAP[label]) return CATEGORY_COLOR_MAP[label];
      let code = 0;
      for(let i = 0; i < label.length; i++) code += label.charCodeAt(i) * (i + 1);
      return FIXED_CHART_COLORS[code % FIXED_CHART_COLORS.length];
    }

    function getPieSegmentColor(label, palette, index){
      if(label === "残額") return "#2563eb";
      if(label === "超過") return "#ef4444";
      if(label === "共通負担") return "#8b5cf6";
      if(label === "そのほか") return "#94a3b8";
      return palette[index % palette.length];
    }

    function exportCSV(){
      const rows = [
        ["date","month","owner","category","memo","amount","is_recurring","recurring_id"],
        ...state.transactions.map(t => [t.date,t.month,t.owner,t.category,t.memo || "",t.amount,t.isRecurring ? "true" : "false",t.recurringId || ""])
      ];
      const csv = rows.map(r => r.map(v => `"${String(v).replaceAll('"','""')}"`).join(",")).join("\\n");
      const blob = new Blob([csv], {type: "text/csv;charset=utf-8;"});
      downloadBlob(blob, "kakeibo.csv");
    }

    function exportJSONBackup(){
      saveState();
      const json = JSON.stringify(state, null, 2);
      const blob = new Blob([json], {type: "application/json;charset=utf-8;"});
      downloadBlob(blob, `kakeibo-full-backup-${getTodayDateKey()}.json`);
    }

    function downloadBlob(blob, fileName){
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function resetAll(){
      if(!confirm("本当に全データを削除しますか？")) return;
      if(!confirm("本当に本当に削除します。戻せません。")) return;
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }

    function toggleTheme(){
      state.theme = state.theme === "dark" ? "light" : "dark";
      saveState();
      applyTheme();
    }

    function applyTheme(){
      document.body.classList.toggle("dark", state.theme === "dark");
    }

    function ownerTag(owner){
      const normalized = normalizeOwner(owner);
      if(normalized === "common") return '<span class="tag tag-common">共通</span>';
      if(normalized === "male") return '<span class="tag tag-male">K</span>';
      return '<span class="tag tag-female">A</span>';
    }

    function normalizeOwner(owner){
      const value = String(owner || "").trim().toLowerCase();
      if(value === "common" || value === "共通") return "common";
      if(value === "male" || value === "k" || value === "男") return "male";
      if(value === "female" || value === "a" || value === "女") return "female";
      return owner === "common" || owner === "male" || owner === "female" ? owner : "common";
    }

    function yen(n){
      return new Intl.NumberFormat("ja-JP", {style:"currency", currency:"JPY", maximumFractionDigits:0}).format(Number(n || 0));
    }

    function sum(arr){
      return arr.reduce((a,b) => a + Number(b || 0), 0);
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    function escapeJs(str){
      return String(str).replaceAll("\\","\\\\").replaceAll("'","\\'");
    }
  </script>
</body>
