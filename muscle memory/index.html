<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muscle Memory</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Training log</p>
          <h1>Muscle Memory</h1>
          <p class="hero-copy">重量、回数、セットをすばやく記録して、昨日の自分を静かに超える。</p>
        </div>
        <div class="hero-metrics" aria-label="全体サマリー">
          <div>
            <span id="totalRecords">0</span>
            <small>records</small>
          </div>
          <div>
            <span id="weeklyVolume">0</span>
            <small>7 days volume</small>
          </div>
        </div>
      </header>

      <nav class="app-tabs" aria-label="画面切り替え">
        <button class="tab-button active" type="button" data-view="log">記録</button>
        <button class="tab-button" type="button" data-view="analysis">分析</button>
      </nav>

      <main class="dashboard view-panel active" id="logView" data-view-panel="log">
        <section class="panel entry-panel" aria-labelledby="entryTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Log workout</p>
              <h2 id="entryTitle">記録を追加</h2>
            </div>
            <button class="ghost-button hidden" id="cancelEditButton" type="button">編集を解除</button>
          </div>

          <form id="recordForm" class="record-form">
            <label>
              メニュー
              <select id="exerciseSelect" name="exercise" required></select>
            </label>

            <label>
              日付
              <input id="dateInput" name="date" type="date" required />
            </label>

            <div class="number-grid">
              <label class="number-field">
                重量 kg
                <input
                  id="weightInput"
                  name="weight"
                  type="number"
                  min="0"
                  step="0.5"
                  inputmode="decimal"
                  placeholder="0"
                />
                <span class="stepper" aria-label="重量を調整">
                  <button type="button" data-adjust="weightInput" data-step="-2.5">-2.5</button>
                  <button type="button" data-adjust="weightInput" data-step="2.5">+2.5</button>
                </span>
              </label>
              <label class="number-field">
                回数
                <input id="repsInput" name="reps" type="number" min="1" step="1" inputmode="numeric" required placeholder="10" />
                <span class="stepper" aria-label="回数を調整">
                  <button type="button" data-adjust="repsInput" data-step="-1">-1</button>
                  <button type="button" data-adjust="repsInput" data-step="1">+1</button>
                </span>
              </label>
              <label class="number-field">
                セット
                <input id="setsInput" name="sets" type="number" min="1" step="1" inputmode="numeric" required placeholder="3" />
                <span class="stepper" aria-label="セット数を調整">
                  <button type="button" data-adjust="setsInput" data-step="-1">-1</button>
                  <button type="button" data-adjust="setsInput" data-step="1">+1</button>
                </span>
              </label>
            </div>

            <label>
              メモ
              <textarea id="noteInput" name="note" rows="3" placeholder="フォーム、疲労感、次回の目標など"></textarea>
            </label>

            <button class="primary-button" id="saveRecordButton" type="submit">記録を保存</button>
          </form>
        </section>

        <section class="panel add-menu-panel" aria-labelledby="menuTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Custom exercise</p>
              <h2 id="menuTitle">メニュー追加</h2>
            </div>
          </div>
          <form id="exerciseForm" class="exercise-form">
            <label>
              筋トレ名
              <input id="newExerciseName" type="text" placeholder="例: ヒップスラスト" required />
            </label>
            <label>
              カテゴリ
              <select id="newExerciseCategory">
                <option value="胸・プッシュ">胸・プッシュ</option>
                <option value="脚">脚</option>
                <option value="背中・プル">背中・プル</option>
                <option value="肩・腕">肩・腕</option>
                <option value="自重・体幹">自重・体幹</option>
                <option value="その他">その他</option>
              </select>
            </label>
            <button class="secondary-button" type="submit">メニューを追加</button>
          </form>
          <div id="exerciseChips" class="chip-list" aria-label="登録済みメニュー"></div>
        </section>

        <section class="panel records-panel" aria-labelledby="recordsTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">History</p>
              <h2 id="recordsTitle">記録一覧</h2>
            </div>
            <select id="filterSelect" aria-label="メニューで絞り込み">
              <option value="all">すべて</option>
            </select>
          </div>
          <div id="recordsList" class="records-list"></div>
        </section>
      </main>

      <main class="analysis-view view-panel" id="analysisView" data-view-panel="analysis">
        <section class="panel analysis-control-panel" aria-labelledby="analysisTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Analyze</p>
              <h2 id="analysisTitle">分析</h2>
            </div>
            <span class="trend-badge" id="trendBadge">記録待ち</span>
          </div>
          <label>
            分析するメニュー
            <select id="analysisExerciseSelect" aria-label="分析するメニュー"></select>
          </label>
        </section>

        <section class="panel summary-panel" aria-labelledby="summaryTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Progress</p>
              <h2 id="summaryTitle">進捗サマリー</h2>
            </div>
          </div>
          <div id="summaryCards" class="summary-grid"></div>
        </section>

        <section class="panel chart-panel" aria-labelledby="weightChartTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Weight trend</p>
              <h2 id="weightChartTitle">重量の推移</h2>
            </div>
          </div>
          <div class="chart-shell" id="weightChart" role="img" aria-label="重量の推移グラフ"></div>
        </section>

        <section class="panel chart-panel" aria-labelledby="repsChartTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Reps trend</p>
              <h2 id="repsChartTitle">回数の推移</h2>
            </div>
          </div>
          <div class="chart-shell" id="repsChart" role="img" aria-label="回数の推移グラフ"></div>
        </section>

        <section class="panel insight-panel" aria-labelledby="insightTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Insight</p>
              <h2 id="insightTitle">成長メモ</h2>
            </div>
          </div>
          <div id="insightList" class="insight-list"></div>
        </section>
      </main>
    </div>

    <template id="recordTemplate">
      <article class="record-card">
        <div class="record-main">
          <p class="record-date"></p>
          <h3></h3>
          <div class="stat-row"></div>
          <p class="record-note"></p>
        </div>
        <div class="record-actions">
          <button class="icon-button edit-record" type="button" aria-label="記録を編集">Edit</button>
          <button class="icon-button danger delete-record" type="button" aria-label="記録を削除">Del</button>
        </div>
      </article>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
